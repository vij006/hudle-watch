name: Hudle Watch

on:
  schedule:
    # Every 30 minutes. GitHub may run it a few minutes late when busy.
    - cron: "*/30 * * * *"
  workflow_dispatch:        # lets you press "Run workflow" by hand

permissions:
  contents: write           # needed so the run can save results back

concurrency:
  group: hudle-watch        # never let two runs overlap
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Kolkata      # so "today" means today in Noida, not UTC

    steps:
      - name: Get the code and previous results
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Install the browser
        run: python -m playwright install --with-deps chromium

      - name: Check courts
        run: python hudle_watch.py --workers 4

      - name: Save results back to the repo
        run: |
          set -e
          git config user.name  "hudle-watch"
          git config user.email "actions@users.noreply.github.com"

          # These result files must never be MERGED. Two runs produce two valid
          # snapshots of the same moment-in-time data, and git cannot reconcile
          # them — that is what caused "CONFLICT (content)" on every scheduled
          # run. The newest run simply wins.
          #
          # So: move HEAD to whatever is on the server right now, WITHOUT
          # touching the files this run just produced, then commit those files
          # as a single change on top. There is nothing to merge, so there is
          # nothing to conflict.
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --mixed "origin/${GITHUB_REF_NAME}"

            git add -A output
            if git diff --staged --quiet; then
              echo "nothing changed - nothing to save"
              exit 0
            fi

            git commit -m "courts update $(date '+%d %b %H:%M IST')"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "saved on attempt ${attempt}"
              exit 0
            fi

            echo "push rejected (someone else pushed first) - retrying"
            sleep 5
          done

          echo "could not save after 3 attempts"
          exit 1
